# PostgreSQL with pgvector: semantic retrieval for the service. Every chunk's vector is
# stored with its access group, and the service filters on the group inside the vector search
# (pgvector's iterative index scan), so nothing restricted is returned and nobody is starved.
# The service loads the committed vectors at start-up when the database does not already
# hold exactly these chunks.
apiVersion: v1
kind: Service
metadata:
  name: clearance-db
spec:
  selector:
    app: clearance-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clearance-db
spec:
  serviceName: clearance-db
  replicas: 1
  selector:
    matchLabels:
      app: clearance-db
  template:
    metadata:
      labels:
        app: clearance-db
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999  # the image's postgres user
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: pgvector/pgvector:0.8.0-pg17
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: clearance
            - name: POSTGRES_DB
              value: clearance
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: clearance-db, key: password}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "clearance", "-d", "clearance"]
            periodSeconds: 3
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - {name: run, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
# Only the service's pods reach the database, and the database reaches nothing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clearance-db-service-only
spec:
  podSelector:
    matchLabels:
      app: clearance-db
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: clearance
      ports:
        - port: 5432
  egress: []
