apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: clearance
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
  - pdb.yaml
  - database.yaml
# Who may read what, mounted into the pods. A copy of config/access.yaml; a test fails if the
# two differ. The generated name changes with the content, so editing access rolls the pods.
configMapGenerator:
  - name: clearance-access
    files:
      - access.yaml
labels:
  - pairs:
      app.kubernetes.io/name: clearance
    includeSelectors: false
