# The service trusts the identity header, so only the gateway may reach it: any other pod in
# the cluster could otherwise claim to be anyone. Outbound, it may only look up names and
# reach its own database: a compromised pod cannot send the handbook anywhere.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clearance-gateway-only
spec:
  podSelector:
    matchLabels:
      app: clearance
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              clearance-gateway: "true"
      ports:
        - port: 8080
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - podSelector:
            matchLabels:
              app: clearance-db
      ports:
        - port: 5432
