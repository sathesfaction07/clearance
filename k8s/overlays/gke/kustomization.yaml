# GKE: the image from Artifact Registry, three replicas spread across zones, and autoscaling.
# Rendered and checked against a real API server in CI (a server-side dry run on kind); never
# applied to a Google Cloud project. Replace PROJECT and the tag at deploy time.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - hpa.yaml
images:
  - name: clearance
    newName: europe-west1-docker.pkg.dev/PROJECT/clearance/clearance
    newTag: "0.2.0"
replicas:
  - name: clearance
    count: 3
patches:
  - target: {kind: Deployment, name: clearance}
    patch: |-
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app: clearance
