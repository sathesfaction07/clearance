# A pod in the same namespace without the gateway label. It must be able to resolve the
# service and the database (so DNS is not what stops it) and must be able to connect to
# neither. It exits 0 only if both connections are blocked.
apiVersion: v1
kind: Pod
metadata:
  name: outsider
  namespace: clearance
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: outsider
      image: clearance:dev
      imagePullPolicy: Never
      command:
        - python
        - -c
        - |
          import socket, sys, urllib.request
          print("resolved clearance to", socket.gethostbyname("clearance"))
          print("resolved clearance-db to", socket.gethostbyname("clearance-db"))
          reached = []
          try:
              urllib.request.urlopen("http://clearance:8080/healthz", timeout=5)
              reached.append("the service")
          except Exception as e:
              print("service blocked:", type(e).__name__)
          try:
              socket.create_connection(("clearance-db", 5432), timeout=5).close()
              reached.append("the database")
          except Exception as e:
              print("database blocked:", type(e).__name__)
          if reached:
              print("REACHED", " and ".join(reached), "without being allowed to")
              sys.exit(1)
          sys.exit(0)
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
