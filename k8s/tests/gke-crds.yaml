# Stand-ins for two GKE resource types kind does not have, so the GKE overlay can be dry-run
# against a real API server. They accept any spec: the dry run checks everything else in the
# overlay (the Deployment, Service, Ingress, NetworkPolicy, autoscaler and budget) against
# Kubernetes' real schemas, but not these two against GKE's.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: backendconfigs.cloud.google.com
spec:
  group: cloud.google.com
  names: {kind: BackendConfig, plural: backendconfigs, singular: backendconfig}
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: managedcertificates.networking.gke.io
spec:
  group: networking.gke.io
  names: {kind: ManagedCertificate, plural: managedcertificates, singular: managedcertificate}
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
