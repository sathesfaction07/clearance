# Labelled questions over the six handbook sections. Each question is written in a team
# member's words (deliberately not copying page headings), and `source` is the page that
# answers it. Retrieval is scored on whether that page appears in the top results.
# `asker` is someone allowed to read the source; leak tests also ask every question as
# everyone else.
