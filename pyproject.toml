[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clearance"
version = "0.2.0"
description = "An enterprise handbook assistant that only retrieves what the asker may read: permission filtering inside retrieval, measured chunking, leak tests, on Kubernetes."
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pyyaml>=6", "starlette>=0.40", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "httpx2>=2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.hatch.build.targets.wheel]
packages = ["src/clearance"]
